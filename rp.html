<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BLACKOUT-RP — estructura de archivos</title>
<style>
  :root{
    --bg:#0b0e14;
    --bg-panel:#0f131b;
    --line:#232733;
    --text:#cfd6e2;
    --text-dim:#7b8496;
    --text-faint:#4c5566;
    --accent-file:#5b6472;
    --folder:#6f97e8;
    --teal-bar:#0d3a35; --teal-text:#7fe0c4; --teal-desc:#5fb89f; --teal-icon:#2dc8a6;
    --purple-bar:#221b4d; --purple-text:#b7b6f7; --purple-desc:#9490d6; --purple-icon:#7a78e8;
    --orange-bar:#3d2210; --orange-text:#ffb27a; --orange-desc:#d99a63; --orange-icon:#e8853a;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--mono);}
  body{padding:28px 18px 60px;}
  .wrap{max-width:920px;margin:0 auto;}

  header h1{
    font-size:20px;margin:0 0 6px;font-weight:700;letter-spacing:.2px;color:#f2f5f9;
    display:flex;align-items:center;gap:10px;
  }
  header h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--teal-icon);box-shadow:0 0 10px var(--teal-icon);}
  header p{margin:0 0 18px;font-size:12.5px;color:var(--text-dim);}

  .toolbar{
    display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;
  }
  .search{
    flex:1;min-width:180px;position:relative;
  }
  .search input{
    width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);
    padding:8px 10px 8px 30px;border-radius:6px;font-family:var(--mono);font-size:13px;outline:none;
    transition:border-color .15s;
  }
  .search input:focus{border-color:var(--folder);}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-faint);}
  .btn{
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text-dim);
    padding:8px 12px;border-radius:6px;font-family:var(--mono);font-size:12px;cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--folder);color:var(--text);}

  .panel{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }

  ul.tree{list-style:none;margin:0;padding:0;}
  ul.tree ul{list-style:none;margin:0;padding-left:20px;}

  li.node{position:relative;}
  li.node > .row{
    display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;
    cursor:default;border-radius:4px;
  }
  li.node.dir > .row{cursor:pointer;}
  li.node.dir > .row:hover{background:#151a24;}

  .caret{
    width:12px;height:12px;flex:none;color:var(--text-faint);
    transition:transform .15s ease;display:flex;align-items:center;justify-content:center;
  }
  li.node.open > .row > .caret{transform:rotate(90deg);}
  li.node.file > .row > .caret{visibility:hidden;}

  .icon{flex:none;width:16px;height:14px;display:flex;align-items:center;justify-content:center;}

  .name{font-size:13px;white-space:nowrap;color:var(--text);}
  .desc{
    font-size:12px;color:var(--text-dim);margin-left:14px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;
  }

  li.node > ul{
    max-height:0;overflow:hidden;transition:max-height .18s ease;
    border-left:1px solid var(--line);margin-left:16px;
  }
  li.node.open > ul{max-height:none;}
  li.node:not(.open) > ul{display:none;}

  /* header rows (carpetas de primer nivel / grupos) */
  li.node.header1 > .row{background:var(--teal-bar);}
  li.node.header1 > .row .name{color:var(--teal-text);font-weight:700;}
  li.node.header1 > .row .desc{color:var(--teal-desc);}
  li.node.header1 > .row:hover{background:#114941;}

  li.node.header2 > .row{background:var(--purple-bar);}
  li.node.header2 > .row .name{color:var(--purple-text);font-weight:700;}
  li.node.header2 > .row .desc{color:var(--purple-desc);}
  li.node.header2 > .row:hover{background:#2b2260;}

  li.node.header3 > .row{background:var(--orange-bar);}
  li.node.header3 > .row .name{color:var(--orange-text);font-weight:700;}
  li.node.header3 > .row .desc{color:var(--orange-desc);}
  li.node.header3 > .row:hover{background:#4a2a13;}

  .badge{
    font-size:10px;background:var(--orange-icon);color:#2a1505;padding:1px 6px;
    border-radius:999px;font-weight:700;margin-left:6px;letter-spacing:.3px;
  }

  .hidden{display:none !important;}
  mark{background:#5b4a12;color:#ffe9a8;border-radius:2px;padding:0 1px;}

  footer{margin-top:18px;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--line);padding-top:12px;}

  .count{font-size:11.5px;color:var(--text-faint);white-space:nowrap;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#232733;border-radius:6px;}

  /* ---------------- Panel de contraseña ---------------- */
  #gate{
    position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#111621 0%,#08090d 70%);
    display:flex;align-items:center;justify-content:center;z-index:100;
    transition:opacity .35s ease, visibility .35s ease;
  }
  #gate.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .gate-card{
    width:100%;max-width:340px;padding:32px 28px;background:var(--bg-panel);
    border:1px solid var(--line);border-radius:10px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .gate-lock{
    width:44px;height:44px;margin:0 auto 16px;border-radius:10px;background:#151a24;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  }
  .gate-card h2{margin:0 0 6px;font-size:15px;color:#f2f5f9;font-weight:700;}
  .gate-card p{margin:0 0 20px;font-size:12px;color:var(--text-dim);}
  .gate-card input{
    width:100%;background:#0b0e14;border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:6px;font-family:var(--mono);font-size:13px;outline:none;
    text-align:center;letter-spacing:1px;transition:border-color .15s;
  }
  .gate-card input:focus{border-color:var(--folder);}
  .gate-card input.error{border-color:#e8536a;animation:shake .3s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .gate-btn{
    width:100%;margin-top:12px;background:var(--teal-icon);color:#052620;border:none;
    padding:10px 12px;border-radius:6px;font-family:var(--mono);font-size:13px;font-weight:700;
    cursor:pointer;transition:filter .15s;
  }
  .gate-btn:hover{filter:brightness(1.1);}
  .gate-msg{margin-top:12px;font-size:11.5px;color:#e8536a;min-height:14px;}

  /* ---------------- Botón flotante de descarga ---------------- */
  #downloadBtn{
    position:fixed;right:22px;bottom:22px;z-index:40;
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#0d3a35,#0f4a41);
    border:1px solid #1c6156;color:#7fe0c4;
    padding:11px 16px;border-radius:999px;font-family:var(--mono);font-size:12.5px;font-weight:700;
    cursor:pointer;box-shadow:0 8px 24px rgba(45,200,166,.18), 0 0 0 0 rgba(45,200,166,.5);
    animation:pulse 2.6s ease-in-out infinite;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #downloadBtn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(45,200,166,.3);}
  #downloadBtn:active{transform:translateY(0);}
  #downloadBtn svg{flex:none;transition:transform .2s ease;}
  #downloadBtn.loading svg{animation:spin .8s linear infinite;}
  #downloadBtn:disabled{opacity:.7;cursor:default;}
  @keyframes pulse{
    0%,100%{box-shadow:0 8px 24px rgba(45,200,166,.18), 0 0 0 0 rgba(45,200,166,.45);}
    50%{box-shadow:0 8px 24px rgba(45,200,166,.28), 0 0 0 10px rgba(45,200,166,0);}
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #downloadToast{
    position:fixed;right:22px;bottom:76px;z-index:40;
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text-dim);
    padding:8px 14px;border-radius:8px;font-size:11.5px;
    opacity:0;transform:translateY(6px);transition:all .25s ease;pointer-events:none;
  }
  #downloadToast.show{opacity:1;transform:translateY(0);}
</style>
</head>

<div id="gate">

    <div class="gate-lock">

    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<button id="downloadBtn" title="Descargar estructura en ZIP">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
  <span id="downloadLabel">Descargar .zip</span>
</button>
<div id="downloadToast">Generando archivo…</div>

<div class="wrap">

      <input id="q" type="text" placeholder="Buscar archivo, carpeta o descripción…" autocomplete="off">
    </div>
    <button class="btn" id="expandAll">Expandir todo</button>
    <button class="btn" id="collapseAll">Colapsar todo</button>
    <span class="count" id="count"></span>
  </div>

  <div class="panel">
    <ul class="tree" id="tree"></ul>
  </div>

  <footer>BLACKOUT-RP · FiveM QBCore roleplay server · <span id="totalCount">0</span> elementos</footer>
</div>

const COLORS = {
  header1:{icon:"#2dc8a6"}, header2:{icon:"#7a78e8"}, header3:{icon:"#e8853a"},
  dir:{icon:"#6f97e8"}, file:{icon:"#4c5566"},
};

/* ---------------------------------------------------------------
   Construcción del árbol
--------------------------------------------------------------- */
let idCounter = 0;

function buildNode(item){
  const id = "n" + (idCounter++);
  const isDir = !!item.c || item.k !== "file";
  const li = document.createElement("li");
  li.className = "node " + item.k + (item.c ? " open dir" : (isDir ? " dir" : " file"));
  li.dataset.id = id;
  li.dataset.searchText = (item.n + " " + item.d).toLowerCase();

  const row = document.createElement("div");
  row.className = "row";

  const caret = document.createElement("span");
  caret.className = "caret";
  caret.innerHTML = ICON_CARET;
  row.appendChild(caret);

  const icon = document.createElement("span");
  icon.className = "icon";
  const c = COLORS[item.k] || COLORS.dir;
  icon.innerHTML = isDir ? folderIcon(c.icon) : fileIcon("#1c212b", c.icon);
  row.appendChild(icon);

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = item.n;
  row.appendChild(name);

  if(item.badge){
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = item.badge;
    row.appendChild(b);
  }

  if(item.d){
    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = item.d;
    row.appendChild(desc);
  }

  li.appendChild(row);

  if(item.c && item.c.length){
    const ul = document.createElement("ul");
    item.c.forEach(child => ul.appendChild(buildNode(child)));
    li.appendChild(ul);
  }

  if(isDir){
    row.addEventListener("click", () => {
      li.classList.toggle("open");
    });
  }

  return li;
}

const treeRoot = document.getElementById("tree");
DATA.forEach(item => treeRoot.appendChild(buildNode(item)));

/* contar elementos totales */
document.getElementById("totalCount").textContent = treeRoot.querySelectorAll("li.node").length;

/* ---------------------------------------------------------------
   Expandir / colapsar todo
--------------------------------------------------------------- */
document.getElementById("expandAll").addEventListener("click", () => {
  treeRoot.querySelectorAll("li.node.dir, li.node.header1, li.node.header2, li.node.header3")
    .forEach(li => { if(li.querySelector(":scope > ul")) li.classList.add("open"); });
});
document.getElementById("collapseAll").addEventListener("click", () => {
  treeRoot.querySelectorAll("li.node").forEach(li => {
    if(li.querySelector(":scope > ul")) li.classList.remove("open");
  });
});

/* ---------------------------------------------------------------
   Búsqueda
--------------------------------------------------------------- */
const input = document.getElementById("q");
const countEl = document.getElementById("count");
const allNodes = Array.from(treeRoot.querySelectorAll("li.node"));

function clearHighlights(){
  treeRoot.querySelectorAll("mark").forEach(m => {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
}

function highlight(el, term){
  const text = el.textContent;
  const idx = text.toLowerCase().indexOf(term);
  if(idx === -1) return;
  const before = text.slice(0, idx);
  const match = text.slice(idx, idx + term.length);
  const after = text.slice(idx + term.length);
  el.innerHTML = "";
  el.appendChild(document.createTextNode(before));
  const mark = document.createElement("mark");
  mark.textContent = match;
  el.appendChild(mark);
  el.appendChild(document.createTextNode(after));
}

input.addEventListener("input", () => {
  const term = input.value.trim().toLowerCase();
  clearHighlights();

  if(!term){
    allNodes.forEach(li => li.classList.remove("hidden"));
    countEl.textContent = "";
    return;
  }

  let matches = 0;
  allNodes.forEach(li => li.classList.add("hidden"));

  allNodes.forEach(li => {
    if(li.dataset.searchText.includes(term)){
      matches++;
      li.classList.remove("hidden");
      // mostrar y expandir todos los ancestros
      let p = li.parentElement;
      while(p && p !== treeRoot){
        if(p.tagName === "UL"){
          const parentLi = p.parentElement;
          parentLi.classList.remove("hidden");
          parentLi.classList.add("open");
        }
        p = p.parentElement;
      }
      // expandir el propio nodo si tiene hijos
      if(li.querySelector(":scope > ul")) li.classList.add("open");

      const nameEl = li.querySelector(":scope > .row > .name");
      const descEl = li.querySelector(":scope > .row > .desc");
      if(nameEl && nameEl.textContent.toLowerCase().includes(term)) highlight(nameEl, term);
      else if(descEl && descEl.textContent.toLowerCase().includes(term)) highlight(descEl, term);
    }
  });

  countEl.textContent = matches + (matches === 1 ? " resultado" : " resultados");
});

/* ---------------------------------------------------------------
   Panel de contraseña
   El hash SHA-256 se compara en el navegador; la contraseña en
   texto plano nunca aparece en el código.
--------------------------------------------------------------- */
const PASSWORD_HASH = "61e97f3a81872ded8a82f567d28dd5b235f0eabffb6ed0f56e5d812c362636ab";

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

const gate = document.getElementById("gate");
const pwdInput = document.getElementById("pwdInput");
const pwdSubmit = document.getElementById("pwdSubmit");
const gateMsg = document.getElementById("gateMsg");

async function tryUnlock(){
  const val = pwdInput.value;
  if(!val) return;
  const hash = await sha256(val);
  if(hash === PASSWORD_HASH){
    gate.classList.add("hidden");
  }else{
    gateMsg.textContent = "Contraseña incorrecta";
    pwdInput.classList.remove("error");
    void pwdInput.offsetWidth; // reinicia la animación
    pwdInput.classList.add("error");
    pwdInput.value = "";
    pwdInput.focus();
  }
}
pwdSubmit.addEventListener("click", tryUnlock);
pwdInput.addEventListener("keydown", e => { if(e.key === "Enter") tryUnlock(); });
pwdInput.focus();

/* ---------------------------------------------------------------
   Descarga en ZIP de la estructura del proyecto
   (carpetas reales + archivos de texto con su descripción)
--------------------------------------------------------------- */
function addToZip(zipFolder, items){
  items.forEach(item => {
    const cleanName = item.n.replace(/\/$/, "");
    if(item.c && item.c.length){
      const sub = zipFolder.folder(cleanName);
      addToZip(sub, item.c);
    }else{
      const content = item.d ? `${item.n}\n${"=".repeat(item.n.length)}\n\n${item.d}\n` : `${item.n}\n`;
      zipFolder.file(cleanName, content);
    }
  });
}

const downloadBtn = document.getElementById("downloadBtn");
const downloadLabel = document.getElementById("downloadLabel");
const downloadToast = document.getElementById("downloadToast");
let jszipLoadPromise = null;

function loadJSZip(){
  if(jszipLoadPromise) return jszipLoadPromise;
  jszipLoadPromise = new Promise((resolve, reject) => {
    if(window.JSZip) return resolve();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("No se pudo cargar JSZip"));
    document.head.appendChild(s);
  });
  return jszipLoadPromise;
}

downloadBtn.addEventListener("click", async () => {
  if(downloadBtn.disabled) return;
  downloadBtn.disabled = true;
  downloadBtn.classList.add("loading");
  downloadLabel.textContent = "Generando…";
  downloadToast.textContent = "Generando archivo…";
  downloadToast.classList.add("show");

  try{
    await loadJSZip();
    const zip = new JSZip();
    const root = zip.folder("BLACKOUT-RP");
    addToZip(root, DATA);
    const blob = await zip.generateAsync({type:"blob"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "BLACKOUT-RP-estructura.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    downloadToast.textContent = "¡Descarga lista!";
  }catch(err){
    downloadToast.textContent = "Error al generar el ZIP";
    console.error(err);
  }finally{
    downloadBtn.disabled = false;
    downloadBtn.classList.remove("loading");
    downloadLabel.textContent = "Descargar .zip";
    setTimeout(() => downloadToast.classList.remove("show"), 2200);
  }
});
</script>
